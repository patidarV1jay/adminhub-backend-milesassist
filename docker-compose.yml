version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: adminhub_postgres
    restart: always
    environment:
      POSTGRES_USER: adminhub
      POSTGRES_PASSWORD: adminhub
      POSTGRES_DB: adminhub_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: adminhub_redis
    restart: always
    ports:
      - '6379:6379'

volumes:
  postgres_data:
